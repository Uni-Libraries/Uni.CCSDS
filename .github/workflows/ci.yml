# CI for uni.ccsds (plan item CCSDS-10): build + unit tests on GCC/Clang/MSVC, ASan/UBSan, the cross-validation
# harness against the NASA USLP reference, and the Doxygen documentation.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2025
            cc: cl
            cxx: cl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Mbed TLS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libmbedtls-dev ninja-build

      - name: Install Mbed TLS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install mbedtls:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux Clang ASan+UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libmbedtls-dev ninja-build clang
      - name: Configure
        # The vendored NASA reference has signed-overflow UB of its own; the harness runs in the release job.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DUNI_CCSDS_ENABLE_ASAN=ON -DUNI_CCSDS_ENABLE_UBSAN=ON -DUSLP_VALIDATION_WITH_NASA=OFF
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  cross-validation:
    name: Cross-validation (NASA USLP reference)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libmbedtls-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - name: Run harness
        run: build/src_validation/cli/uslp-validate --scenarios src_validation/resources/suites --artifact-dir build/validation --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uslp-validation
          path: build/validation/

  docs:
    name: Doxygen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends doxygen graphviz
      - name: Generate (warnings are errors)
        run: mkdir -p build/docs && doxygen Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: uni-ccsds-api-docs
          path: build/docs/html/
